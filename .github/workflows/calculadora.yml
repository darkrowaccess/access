name: Build Calculadora
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q Calculadora.zip
      - run: cd Calculadora && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Calculadora-apk
          path: Calculadora/app/build/outputs/apk/debug/app-debug.apk
