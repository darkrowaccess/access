<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para vos ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    img {
      width: 200px;
      transition: 0.5s;
      cursor: pointer;
    }

    h1 {
      margin: 20px;
    }

    button {
      width: 100px;
      height: 100px;
      margin: 10px;
      font-size: 20px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }

    #yes { background: green; color: white; }
    #no { background: red; color: white; position: fixed; }

    /* 💖 TEXTO */
    #finalBox {
      margin-top: 20px;
      font-size: 30px;
      color: #ff4d6d;
      font-family: 'Pacifico', cursive;
      display: none;

      text-shadow: 0 0 10px pink;
      animation: latir 1s infinite;
    }

    @keyframes latir {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* 💥 PANTALLA COMPLETA */
    .fullscreen {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(2);
      z-index: 9999;
    }

  </style>
</head>

<body>

  <div class="container">

    <img id="gif" src="amor.gif">

    <h1 id="titulo">¿Querés estar conmigo? 🥺</h1>

    <button id="yes">YES</button>
    <button id="no">NO</button>

    <div id="finalBox">TE AMO BELU ❤️</div>

  </div>

  <script>

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const gif = document.getElementById("gif");
    const finalBox = document.getElementById("finalBox");
    const titulo = document.getElementById("titulo");

    // mover NO
    no.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);

      no.style.left = x + "px";
      no.style.top = y + "px";
    });

    // CLICK YES
    yes.addEventListener("click", () => {
      yes.style.display = "none";
      no.style.display = "none";
      titulo.style.display = "none";

      // 💖 mostrar texto
      finalBox.style.display = "block";
    });

    // DOBLE CLICK GIF
    gif.addEventListener("dblclick", () => {
      gif.style.display = "none";
      finalBox.classList.add("fullscreen");
    });

  </script>

</body>
</html>

  </script>

</body>
</html>
