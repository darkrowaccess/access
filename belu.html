<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para vos ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffffff, #f0f0f0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    img {
      width: 70%;
      max-width: 220px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 30px;
    }

    /* 🔥 BOTONES CUADRADOS */
    .btn {
      width: 120px;
      height: 120px;
      font-size: 20px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      margin: 10px;
      display: inline-block;
    }

    #yes {
      background: #4CAF50;
      color: white;
      transition: transform 0.2s;
    }

    #no {
      background: #f44336;
      color: white;
      position: fixed;
    }

    #mensaje {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img id="gif" src="amor.gif">

    <h1>¿Querés estar conmigo? 🥺</h1>

    <button id="yes" class="btn">YES</button>
    <button id="no" class="btn">NO</button>

    <h2 id="mensaje"></h2>

  </div>

  <script>
    let escala = 1;

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const mensaje = document.getElementById("mensaje");

    // Eventos
    no.addEventListener("mouseenter", moverNo);
    no.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moverNo();
    });

    function moverNo() {
      // vibración
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

      const btnWidth = no.offsetWidth;
      const btnHeight = no.offsetHeight;

      const maxX = window.innerWidth - btnWidth;
      const maxY = window.innerHeight - btnHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      no.style.left = x + "px";
      no.style.top = y + "px";

      // agrandar YES
      if (escala < 2.5) {
        escala += 0.1;
      }
      yes.style.transform = `scale(${escala})`;
    }

    // Click en YES
    yes.addEventListener("click", () => {
      mensaje.innerHTML = "Sabía que ibas a decir que sí 😍❤️";

      // 💥 eliminar NO
      no.style.display = "none";
    });
  </script>

</body>
</html>
