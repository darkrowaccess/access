<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para vos ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffffff, #f0f0f0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    img {
      width: 70%;
      max-width: 220px;
      margin-bottom: 20px;
      transition: transform 0.5s ease;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 30px;
    }

    .btn {
      width: 120px;
      height: 120px;
      font-size: 20px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      margin: 10px;
      display: inline-block;
    }

    #yes {
      background: #4CAF50;
      color: white;
      transition: transform 0.2s;
    }

    #no {
      background: #f44336;
      color: white;
      position: fixed;
    }

    /* 💖 CAJA FINAL (SIEMPRE VISIBLE) */
    #finalBox {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) scale(0.5);

      padding: 15px 25px;
      background: rgba(255, 192, 203, 0.3);
      border-radius: 20px;

      font-size: 30px;
      color: #ff4d6d;
      font-family: 'Pacifico', cursive;

      opacity: 0;
      transition: all 0.5s ease;

      text-shadow:
        0 0 5px #ff4d6d,
        0 0 10px #ff4d6d,
        0 0 20px #ff85a2;
    }

    .show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* 💖 corazones */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: float 5s linear infinite;
      color: pink;
      pointer-events: none;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

  </style>
</head>

<body>

  <div class="container">

    <img id="gif" src="amor.gif">

    <h1>¿Querés estar conmigo? 🥺</h1>

    <button id="yes" class="btn">YES</button>
    <button id="no" class="btn">NO</button>

  </div>

  <!-- 💖 TEXTO FINAL -->
  <div id="finalBox">TE AMO BELU ❤️</div>

  <script>
    let escala = 1;

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const gif = document.getElementById("gif");
    const finalBox = document.getElementById("finalBox");

    // mover NO
    no.addEventListener("mouseenter", moverNo);
    no.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moverNo();
    });

    function moverNo() {
      if (navigator.vibrate) navigator.vibrate(100);

      const x = Math.random() * (window.innerWidth - no.offsetWidth);
      const y = Math.random() * (window.innerHeight - no.offsetHeight);

      no.style.left = x + "px";
      no.style.top = y + "px";

      if (escala < 2.5) escala += 0.1;
      yes.style.transform = `scale(${escala})`;
    }

    // 💖 corazones
    function crearCorazon() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (20 + Math.random() * 20) + "px";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5000);
    }

    // 💥 CLICK YES
    yes.addEventListener("click", () => {

      // ocultar todo
      yes.style.display = "none";
      no.style.display = "none";
      document.querySelector("h1").style.display = "none";

      // agrandar GIF SIN romper layout
      gif.style.transform = "scale(1.2)";

      // mostrar texto SIEMPRE
      finalBox.classList.add("show");

      // corazones
      setInterval(crearCorazon, 300);
    });
  </script>

</body>
</html>
