<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para vos ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffffff, #f0f0f0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    img {
      width: 70%;
      max-width: 220px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 30px;
    }

    .btn {
      width: 80%;
      padding: 15px;
      font-size: 22px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px auto;
      display: block;
    }

    #yes {
      background: #4CAF50;
      color: white;
      transition: 0.3s;
    }

    #no {
      background: #f44336;
      color: white;
      position: absolute;
    }

    #mensaje {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- GIF (cambialo por el tuyo) -->
    <img id="gif" src="amor.gif">

    <h1>¿Querés estar conmigo? 🥺</h1>

    <button id="yes" class="btn">YES</button>
    <button id="no" class="btn">NO</button>

    <h2 id="mensaje"></h2>

  </div>

  <script>
    let tamaño = 22;

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const mensaje = document.getElementById("mensaje");

    // Movimiento del NO (mejorado para celular)
    no.addEventListener("mouseover", moverNo);
    no.addEventListener("touchstart", moverNo);

    function moverNo() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);

      no.style.left = x + "px";
      no.style.top = y + "px";

      // agrandar el YES
      tamaño += 8;
      yes.style.fontSize = tamaño + "px";
      yes.style.padding = (tamaño/2) + "px " + tamaño + "px";
    }

    // Click en YES
    yes.addEventListener("click", () => {
      mensaje.innerHTML = "Sabía que ibas a decir que sí 😍❤️";

      // cambia el GIF
      document.getElementById("gif").src = "amor.gif";
    });
  </script>

</body>
</html>
