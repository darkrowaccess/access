<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para vos ❤️</title>

  <!-- fuente linda -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffffff, #f0f0f0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    img {
      width: 70%;
      max-width: 220px;
      margin-bottom: 20px;
      transition: transform 0.5s ease;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 30px;
    }

    .btn {
      width: 120px;
      height: 120px;
      font-size: 20px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      margin: 10px;
      display: inline-block;
    }

    #yes {
      background: #4CAF50;
      color: white;
      transition: transform 0.2s;
    }

    #no {
      background: #f44336;
      color: white;
      position: fixed;
    }

    #mensaje {
      margin-top: 20px;
      font-size: 20px;
    }

    /* 💖 mensaje final */
    #final {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 40px;
      color: #ff4d6d;
      font-family: 'Pacifico', cursive;
      text-align: center;
      transition: transform 0.5s ease;
    }

    .show {
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>

<body>

  <div class="container">

    <img id="gif" src="amor.gif">

    <h1>¿Querés estar conmigo? 🥺</h1>

    <button id="yes" class="btn">YES</button>
    <button id="no" class="btn">NO</button>

    <h2 id="mensaje"></h2>

  </div>

  <!-- 💖 MENSAJE FINAL -->
  <div id="final">TE AMO BELU ❤️</div>

  <script>
    let escala = 1;

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const mensaje = document.getElementById("mensaje");
    const gif = document.getElementById("gif");
    const final = document.getElementById("final");

    // Movimiento NO
    no.addEventListener("mouseenter", moverNo);
    no.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moverNo();
    });

    function moverNo() {
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

      const btnWidth = no.offsetWidth;
      const btnHeight = no.offsetHeight;

      const maxX = window.innerWidth - btnWidth;
      const maxY = window.innerHeight - btnHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      no.style.left = x + "px";
      no.style.top = y + "px";

      if (escala < 2.5) {
        escala += 0.1;
      }
      yes.style.transform = `scale(${escala})`;
    }

    // CLICK YES
    yes.addEventListener("click", () => {
      mensaje.innerHTML = "";

      // 💥 desaparecen botones
      yes.style.display = "none";
      no.style.display = "none";

      // 💖 agrandar GIF
      gif.style.transform = "scale(1.8)";

      // 💖 mostrar mensaje final
      setTimeout(() => {
        final.classList.add("show");
      }, 300);
    });
  </script>

</body>
</html>
